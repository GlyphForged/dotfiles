# GlyphForged tmux config
# Pane navigation without prefix
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-l select-pane -R
bind -n M-k select-pane -U

# Split panes with Shift
bind -n M-H split-window -h \; select-pane -L
bind -n M-K split-window -v \; select-pane -U
bind -n M-J split-window -v
bind -n M-L split-window -h

# Kill pane
bind -n M-x kill-pane
bind -n M-w kill-pane

bind -n M-r source-file ~/.tmux.conf \; display "Config reloaded!"
