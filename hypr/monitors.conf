# See https://wiki.hyprland.org/Configuring/Monitors/
# List current monitors and resolutions possible: hyprctl monitors
# Format: monitor = [port], resolution, position, scale

# Optimized for retina-class 2x displays, like 13" 2.8K, 27" 5K, 32" 6K.
env = GDK_SCALE,1

monitor=HDMI-A-1,1920x1080@60.00,3472x352,1.00,bitdepth,10,cm,wide
monitor=DP-2,3440x1440@99.98,0x0,1.00

# Assign Workspaces 1-4 to the DP-2 monitor (Left)
workspace = 1, monitor:DP-2
workspace = 2, monitor:DP-2
workspace = 3, monitor:DP-2
workspace = 4, monitor:DP-2

# Assign Workspaces 5-8 to the HDMI-A-1 monitor (Right)
workspace = 5, monitor:HDMI-A-1
workspace = 6, monitor:HDMI-A-1
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1

# Assign Mail Workspace to 9
workspace = 9, name:Mail, monitor: DP-2
