format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$golang\
$nodejs\
$rust\
$python\
$time\
$cmd_duration\
$line_break\
$character
"""

palette = "cyberpunk-vibrant"

[palettes.cyberpunk-vibrant]
ink = "#060814"
night = "#0B1020"
panel = "#151D3B"
violet = "#A855F7"
magenta = "#FF4FD8"
cyan = "#5EE7FF"
blue = "#60A5FA"
pink = "#FF9CEB"
pearl = "#F4EEFF"
warning = "#FFB86B"

[fill]
symbol = " "

[username]
show_always = true
style_user = "fg:ink bg:magenta bold"
style_root = "fg:ink bg:warning bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "fg:ink bg:cyan bold"
# ノード = "node" or "machine"
format = "[ ノード $hostname ]($style)"

[directory]
style = "fg:pearl bg:panel bold"
format = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo = false

[git_branch]
symbol = "git:"
style = "fg:ink bg:blue bold"
format = "[ $symbol$branch ]($style)"

[git_status]
style = "fg:pearl bg:violet bold"
format = "([ $all_status$ahead_behind ]($style))"

[golang]
symbol = "go "
style = "fg:cyan bg:night"
format = "[ $symbol$version ]($style)"

[nodejs]
symbol = "node "
style = "fg:cyan bg:night"
format = "[ $symbol$version ]($style)"

[rust]
symbol = "rust "
style = "fg:cyan bg:night"
format = "[ $symbol$version ]($style)"

[python]
symbol = "py "
style = "fg:cyan bg:night"
format = "[ $symbol$version ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:ink bg:cyan bold"
# 時刻 = "time" / current time
format = "[ 時刻 $time ]($style)"

[cmd_duration]
min_time = 500
style = "fg:ink bg:pink bold"
# 所要 = "elapsed" / time taken
format = "[ 所要 $duration ]($style)"

[character]
# サ(sa) ム(mu)ラ(ra)イ(i)
success_symbol = "[[サムライ](fg:magenta) >>](fg:cyan bold)"
# エ(e)ラ(ra)ー(a)
error_symbol = "[[エラー](fg:warning bold) >>](fg:pink bold)"
# コ(ko)マ(ma)ン(n)ド(do)
vimcmd_symbol = "[[コマンド](fg:blue) <<](fg:cyan bold)"
# イ(i)チ(chi)モ(mo)ジ(ji) == "single character"
vimcmd_replace_one_symbol = "[[イチモジ](fg:warning bold) <>](fg:pink bold)"
# リ(ri)プ(pu)レ(re)ー(e)ス(su)
vimcmd_replace_symbol = "[[リプレース](fg:warning bold) <>](fg:pink bold)"
# ビ(bi)ジュ(ju)ア(a)ル(ru)
vimcmd_visual_symbol = "[[ビジュアル](fg:magenta) <<](fg:cyan bold)"

